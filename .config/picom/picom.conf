# Backend and performance. Tuned to stay out of the way of games:
# unredir-if-possible lets fullscreen windows bypass the compositor entirely,
# so games run at native latency while the desktop stays tear-free.
backend = "glx";
glx-no-stencil = true;
vsync = true;
unredir-if-possible = true;
# use-damage speeds up redraws but flashes stale pixels around windows whose
# shape changes (the bar islands reshape as the status grows) - keep it off.
use-damage = false;
detect-transient = true;
detect-client-leader = true;
detect-rounded-corners = true;

# Rounded corners. dwm's bar shapes its own rounded islands and dmenu draws
# its own border, so both are excluded here; dunst rounds itself.
corner-radius = 10;
rounded-corners-exclude = [
	"class_g = 'dwm'",
	"class_g = 'dmenu'",
	"window_type = 'notification'"
];

# Subtle drop shadows.
shadow = true;
shadow-radius = 14;
shadow-opacity = 0.55;
shadow-offset-x = -12;
shadow-offset-y = -10;
shadow-exclude = [
	"_GTK_FRAME_EXTENTS@:c"
];

# Fast, subtle fading so windows feel smooth without feeling laggy.
fading = true;
fade-in-step = 0.08;
fade-out-step = 0.08;
fade-delta = 5;

# Background blur costs GPU time; uncomment to enable.
# blur-method = "dual_kawase";
# blur-strength = 4;
