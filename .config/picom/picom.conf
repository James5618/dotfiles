# Backend and performance. Tuned to stay out of the way of games:
# unredir-if-possible lets fullscreen windows bypass the compositor entirely,
# so games run at native latency while the desktop stays tear-free.
backend = "glx";
vsync = true;
unredir-if-possible = true;
# use-damage speeds up redraws but flashes stale pixels around windows whose
# shape changes (the bar islands reshape as the status grows) - keep it off.
use-damage = false;
detect-transient = true;
detect-client-leader = true;
# detect-rounded-corners only feeds shadow-ignore-shaped and unredir-if-possible
# - it is not a switch for whether picom clips a window to its shape, which is
# what it sounds like. Left off: nothing here needs to match rounded_corners in
# a condition, and the shadow rule below is written against bounding_shaped.
detect-rounded-corners = false;

# Rounded corners. The xrender backend does round them - what made it look
# otherwise was the shadow below, painting squares back into the corners it
# had just cut. What xrender cannot do is antialias the curve: its mask is one
# bit deep, so the corners come out stepped. Only the GL backends blend them,
# and glx has no DRM device to paint through under VMware, so stepped is the
# ceiling here. It is not the ceiling on real hardware, where glx runs and
# this same radius comes out smooth.
corner-radius = 10;
rounded-corners-exclude = [
	"class_g = 'dwm'",
	"class_g = 'dmenu'",
	"window_type = 'notification'"
];

# Subtle drop shadows.
shadow = true;
shadow-radius = 14;
shadow-opacity = 0.55;
shadow-offset-x = -12;
shadow-offset-y = -10;
shadow-exclude = [
	"_GTK_FRAME_EXTENTS@",
	# dwm's bar is one full-width window shaped into two pills, and the
	# shadow is cast by its bounding box rather than that shape - which
	# paints a dark band right across the gap between them. The bar wants no
	# shadow anyway. (WM_CLASS is dwm; only the bar has it.)
	"class_g = 'dwm'",
	# The bar was only the first window to show it: a shadow follows the
	# bounding box and never the shape, so any shaped window gets its corners
	# filled back in square. This is the general form of the rule above. It
	# matches nothing among ordinary windows while picom owns the rounding -
	# picom's own corners are not a bounding shape - but it is what keeps
	# dwm's wincornerradius usable, and it costs nothing to leave set.
	"bounding_shaped"
];

# Fast, subtle fading so windows feel smooth without feeling laggy.
fading = true;
fade-in-step = 0.08;
fade-out-step = 0.08;
fade-delta = 5;

# Background blur costs GPU time; uncomment to enable.
# blur-method = "dual_kawase";
# blur-strength = 4;
