<?xml version='1.0'?>
<!DOCTYPE fontconfig SYSTEM 'fonts.dtd'>
<fontconfig>
	<alias>
		<family>serif</family>
		<prefer>
			<family>Libertinus Serif</family>
			<family>DejaVu Serif</family>
			<family>Joy Pixels</family>
			<family>Noto Color Emoji</family>
			<family>FontAwesome</family>
		</prefer>
	</alias>
	<alias>
		<family>sans-serif</family>
		<prefer>
			<family>Libertinus Sans</family>
			<family>DejaVu Sans</family>
			<family>Joy Pixels</family>
			<family>Noto Color Emoji</family>
			<family>FontAwesome</family>
		</prefer>
	</alias>
	<alias>
		<family>sans</family>
		<prefer>
			<family>Libertinus Sans</family>
			<family>DejaVu Sans</family>
			<family>Joy Pixels</family>
			<family>Noto Color Emoji</family>
			<family>FontAwesome</family>
		</prefer>
	</alias>
	<alias>
		<family>monospace</family>
		<prefer>
			<family>JetBrainsMono Nerd Font</family>
			<family>Noto Sans Mono</family>
			<family>Libertinus Mono</family>
			<!-- Keep a real monospace font ahead of the glyph-only fonts below:
			     if every preceding family is missing, fontconfig picks the icon
			     font and renders all text as dingbats. -->
			<family>DejaVu Sans Mono</family>
			<family>FontAwesome</family>
			<family>Braille</family>
		</prefer>
	</alias>
</fontconfig>
